    name: Seven Deaths of the Meadow
    meta_line: "JS13KGAMES 2026 ENTRY · CANVAS · UNDER 13 KB"
    source: open
    draft: true
    href: "https://play.js13kgames.com/seven-deaths-of-the-meadow"
    href_label: "Play in the browser"
    tags: ["javascript", "canvas", "roadroller", "js13k"]
    date: 2026-09-10 # [CONFIRM] submission date (tag submit-2026-09-10)
    blurb: "A js13kGames 2026 entry: ninety-second runs in a pastel meadow, where only what you worked out carries over."
    prose: |
      A game jam entry under a 13-kilobyte limit, on the theme Unicorns and
      Rainbows. There are no assets; everything is drawn in code, and the build
      fails if the zip goes over budget.[^entry]
    claims:
      - id: entry
        text: "submitted and playable"
        evidence:
          url: "https://js13kgames.com/2026/games/seven-deaths-of-the-meadow"
          label: "js13kGames 2026 — entry page"
        verified: false
    not_yet:
      - "The repository has no licence file." # [CONFIRM] keep, or add a licence and drop this line
