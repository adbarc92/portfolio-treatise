# Build → gates → deploy to adbarc92.github.io (the public Pages repo).
# Both repos are public; this one holds the source, the target holds only gated
# build output.
# Required secrets: PAGES_DEPLOY_TOKEN (classic PAT, repo + workflow scopes on
# adbarc92.github.io).
name: build-gate-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # claims gate + plate-drift gate run in-process and fail this step
      - run: npm run build
      # the gate must catch its canary before it is trusted with the real scan
      - run: node scripts/content-gate.mjs --selftest
      - run: node scripts/content-gate.mjs
      # markup that references styling which does not exist is valid HTML and
      # valid CSS, so nothing else catches it. See scripts/style-gate.mjs.
      - run: node scripts/style-gate.mjs --selftest
      - run: node scripts/style-gate.mjs
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist }

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - name: Replace adbarc92.github.io content with gated output
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          test -n "$PAGES_TOKEN" || { echo "PAGES_DEPLOY_TOKEN not set — refusing to deploy"; exit 1; }
          # The next steps delete the whole target repo before copying dist/ in.
          # If the artifact ever arrives empty or malformed, that would publish an
          # empty site, so refuse before anything destructive happens.
          test -s dist/index.html || { echo "dist/index.html missing or empty — refusing to deploy"; exit 1; }
          git clone --depth 1 "https://x-access-token:${PAGES_TOKEN}@github.com/adbarc92/adbarc92.github.io" site
          if [ -f site/CNAME ]; then cp site/CNAME dist/CNAME; fi
          cd site
          git rm -rq . 2>/dev/null || true
          cp -r ../dist/. .
          touch .nojekyll
          mkdir -p .github/workflows
          cp ../deploy-target/pages.yml .github/workflows/pages.yml
          git config user.name "treatise-ci"
          git config user.email "adbarclay92@gmail.com"
          git add -A
          # A docs-only merge leaves the gated output byte-identical, and `git
          # commit` exits 1 on an empty diff — which fails the job under `bash -e`
          # even though there is nothing wrong and nothing to publish.
          if git diff --staged --quiet; then
            echo "gated output unchanged — nothing to deploy"
          else
            git commit -m "deploy: treatise ${GITHUB_SHA::7}"
            git push
          fi
