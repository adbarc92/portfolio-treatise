# Installed into adbarc92.github.io by the treatise deploy job.
# That repo holds only gated static output; this just publishes it to Pages.
name: pages
on:
  push:
    branches: [main]
permissions:
  pages: write
  id-token: write
  contents: read
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # include-hidden-files defaults to false from v5, which would drop
      # `.nojekyll`. v3 excluded only .git/.github, so `true` preserves exactly
      # what has been published to date.
      - uses: actions/upload-pages-artifact@v5
        with: { path: ., include-hidden-files: true }
      - id: deployment
        uses: actions/deploy-pages@v5
