author:
  draft: true # my draft of the paragraph the reference specifies; awaiting Alex's voice
  prose: |
    I came to software from philosophy, by way of Hack Reactor, and grew up as
    an engineer at Garmin — SE to SE II to Senior — building mobile platform
    software. The work above is the conviction that formed along the way:
    systems that act on their own should be trusted the way engineers trust
    anything, on evidence. The essays and the workshop are the same argument
    carried into other materials — institutions and stories, like software,
    earn trust by what they can show, not by what they say.
