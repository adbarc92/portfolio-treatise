# Build → gates → deploy to adbarc92.github.io (the public Pages repo).
# Source stays in this private repo; only gated build output ships.
# Required secrets: EMBARGO_TERMS (comma-separated, fail-closed if absent),
# PAGES_DEPLOY_TOKEN (classic PAT, repo + workflow scopes on adbarc92.github.io).
name: build-gate-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # claims gate + plate-drift gate run in-process and fail this step
      - run: npm run build
      # the gate must catch its canary before it is trusted with the real scan
      - run: node scripts/embargo-gate.mjs --selftest
      - run: node scripts/embargo-gate.mjs
        env:
          EMBARGO_TERMS: ${{ secrets.EMBARGO_TERMS }}
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Replace adbarc92.github.io content with gated output
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          test -n "$PAGES_TOKEN" || { echo "PAGES_DEPLOY_TOKEN not set — refusing to deploy"; exit 1; }
          git clone --depth 1 "https://x-access-token:${PAGES_TOKEN}@github.com/adbarc92/adbarc92.github.io" site
          if [ -f site/CNAME ]; then cp site/CNAME dist/CNAME; fi
          cd site
          git rm -rq . 2>/dev/null || true
          cp -r ../dist/. .
          touch .nojekyll
          mkdir -p .github/workflows
          cp ../deploy-target/pages.yml .github/workflows/pages.yml
          git config user.name "treatise-ci"
          git config user.email "adbarclay92@gmail.com"
          git add -A
          git commit -m "deploy: treatise ${GITHUB_SHA::7}"
          git push
